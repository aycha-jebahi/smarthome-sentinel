version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: smarthome_postgres
    environment:
      POSTGRES_DB: smarthome_sentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: